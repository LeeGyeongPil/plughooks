# Tests run on fixtures only (no network, no real ~/.claude).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch Node or dependency changes
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      - run: npm run demo
